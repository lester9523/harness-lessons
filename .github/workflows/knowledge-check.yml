name: Knowledge checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check knowledge structure and links
        run: python3 scripts/check_knowledge.py
      - name: Check whitespace
        run: git diff-tree --check --root HEAD
